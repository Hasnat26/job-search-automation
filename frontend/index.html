<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Search Automation</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; color: #222; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 24px; }
    button { margin-top: 16px; padding: 10px 18px; cursor: pointer; }
    #status { margin-top: 20px; white-space: pre-wrap; }
    pre { background: #f5f5f5; padding: 16px; overflow-x: auto; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Job Search Automation</h1>
  <p>Upload your CV to build a structured candidate profile.</p>
  <div class="card">
    <form id="cv-form">
      <input id="cv-file" type="file" accept=".pdf,.docx,.txt,.md" required>
      <br>
      <button type="submit">Process CV</button>
    </form>
    <div id="status"></div>
    <div id="result"></div>
  </div>
  <script>
    const form = document.getElementById("cv-form");
    const fileInput = document.getElementById("cv-file");
    const status = document.getElementById("status");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      status.textContent = "Processing CV...";
      result.innerHTML = "";

      const body = new FormData();
      body.append("file", file);

      try {
        const response = await fetch("/api/cv", { method: "POST", body });
        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || "CV processing failed");

        status.textContent = "CV processed successfully.";
        const pre = document.createElement("pre");
        pre.textContent = JSON.stringify(data, null, 2);
        result.appendChild(pre);
      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    });
  </script>
</body>
</html>
